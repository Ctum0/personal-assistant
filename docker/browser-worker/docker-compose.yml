services:
  browser-worker:
    build:
      context: ../..
      dockerfile: docker/browser-worker/Dockerfile
    container_name: sofia-browser-worker
    hostname: browser-worker
    restart: unless-stopped
    user: "1000:1000"

    # Security Hardening & Capability Dropping
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Read-only Root Filesystem with ephemeral tmpfs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /home/pwuser/.cache:rw,nosuid,size=512m,mode=1777
      - /home/pwuser/.local:rw,nosuid,size=64m,mode=1777

    # Strict Resource Constraints
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
          pids: 500

    environment:
      - NODE_ENV=production
      - BROWSER_WORKER_PORT=9222
      - BROWSER_WORKER_HOST=0.0.0.0
      - BROWSER_WORKER_SECRET=${BROWSER_WORKER_SECRET:-change_in_production}

    # Private internal network only - no public host port exposure
    networks:
      - coolify

networks:
  coolify:
    external: true
